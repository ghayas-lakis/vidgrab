name: Build APK
on:
  push:
  workflow_dispatch:
  # Every Monday: sites change all the time, so this shows when one breaks even without new commits.
  schedule:
    - cron: "0 6 * * 1"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
      # Signs with the fixed key from the VIDGRAB_KEYSTORE secret when it is set (see README).
      - name: Build
        env:
          VIDGRAB_KEYSTORE_B64: ${{ secrets.VIDGRAB_KEYSTORE }}
        run: bash ci/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: VidGrab-apk
          path: app/build/outputs/apk/debug/*.apk

  # Installs the app on an Android emulator and runs real downloads, optimize and delete
  # (app/src/androidTest). See ci/e2e.sh.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.7
      - name: Run end-to-end tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The YouTube test only warns (CI's IPs are often blocked by YouTube), so run it second.
          script: bash ci/e2e.sh core; c=$?; bash ci/e2e.sh youtube; exit $c
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-results
          path: ci-out/
